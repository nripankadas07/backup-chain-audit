[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-chain-audit"
version = "0.1.0"
description = "Offline captured-input analysis with explicit evidence and bounded contracts"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dr. Nripanka Das"}]
dependencies = []

[project.scripts]
backup-chain-audit = "backup_chain_audit:main"

[tool.setuptools]
py-modules = ["backup_chain_audit"]
